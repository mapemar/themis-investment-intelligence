name: THEMIS browser smoke test
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open every THEMIS page in Chromium
        run: python -m pytest browser_tests -q
