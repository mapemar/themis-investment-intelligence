name: THEMIS quality checks
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No inline application script found"
          Path("/tmp/themis-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/themis-inline.js
          for f in assets/*.js; do node --check "$f"; done
